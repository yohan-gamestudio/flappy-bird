
<canvas id="c" width="400" height="550" style="display:block;margin:0 auto;border-radius:12px;cursor:pointer;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400, H = 550;
const GRAVITY = 0.45;
const JUMP = -8.5;
const PIPE_W = 52;
const GAP = 145;
const PIPE_SPEED = 2.4;

let bird, pipes, score, best, state, frame, groundX;

function init() {
  bird = { x: 80, y: H/2, vy: 0, w: 34, h: 26, rot: 0 };
  pipes = [];
  score = 0;
  best = best || 0;
  state = 'idle';
  frame = 0;
  groundX = 0;
  addPipe();
}

function addPipe() {
  const minTop = 80;
  const maxTop = H - 120 - GAP;
  const top = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
  pipes.push({ x: W + 10, top, passed: false });
}

function jump() {
  if (state === 'idle') { state = 'play'; }
  if (state === 'play') { bird.vy = JUMP; }
  if (state === 'dead') { init(); }
}

canvas.addEventListener('click', jump);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });

function drawSky() {
  const sky = ctx.createLinearGradient(0, 0, 0, H - 60);
  sky.addColorStop(0, '#70C5CE');
  sky.addColorStop(1, '#9EDDE5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H - 60);
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 20*s, 0, Math.PI*2);
  ctx.arc(x+20*s, y-8*s, 15*s, 0, Math.PI*2);
  ctx.arc(x+38*s, y, 18*s, 0, Math.PI*2);
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = '#DED895';
  ctx.fillRect(0, H-60, W, 60);
  ctx.fillStyle = '#C6B85A';
  ctx.fillRect(0, H-60, W, 12);

  ctx.fillStyle = '#B5A94E';
  const tileW = 40;
  for (let i = -tileW + (groundX % tileW); i < W; i += tileW) {
    ctx.fillRect(i, H-60, 2, 12);
  }
}

function drawPipe(x, top) {
  const r = 6;
  const capH = 18;
  const capExtra = 6;

  const grad1 = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  grad1.addColorStop(0, '#5DB85D');
  grad1.addColorStop(0.4, '#73D673');
  grad1.addColorStop(1, '#3A8C3A');

  ctx.fillStyle = grad1;
  roundRect(ctx, x + 2, 0, PIPE_W - 4, top - capH, r, true, false);
  roundRect(ctx, x + 2, top - capH, PIPE_W - 4, top, 0, true, false);

  ctx.fillStyle = '#3A8C3A';
  ctx.fillRect(x + 2, 0, 6, top - capH);

  const capY = top - capH;
  ctx.fillStyle = grad1;
  roundRect(ctx, x - capExtra, capY, PIPE_W + capExtra*2, capH, r, true, false);
  ctx.fillStyle = '#3A8C3A';
  ctx.fillRect(x - capExtra, capY, 6, capH);

  const bot = top + GAP;
  ctx.fillStyle = grad1;
  roundRect(ctx, x + 2, bot + capH, PIPE_W - 4, H - 60 - bot - capH, 0, true, false);

  ctx.fillStyle = grad1;
  roundRect(ctx, x - capExtra, bot, PIPE_W + capExtra*2, capH, r, true, false);
  ctx.fillStyle = '#3A8C3A';
  ctx.fillRect(x - capExtra, bot, 6, capH);
}

function roundRect(ctx, x, y, w, h, r, fill) {
  if (h < 0) return;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
}

function drawBird(x, y, rot, flap) {
  ctx.save();
  ctx.translate(x + 17, y + 13);
  ctx.rotate(rot);

  const wingY = Math.sin(flap * 0.4) * 6;

  ctx.fillStyle = '#F7D51D';
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#E8C31A';
  ctx.beginPath();
  ctx.arc(0, 4, 13, 0, Math.PI);
  ctx.fill();

  ctx.fillStyle = '#F0C020';
  ctx.beginPath();
  ctx.ellipse(-8, -10 + wingY, 10, 6, -0.3, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -5, 7, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#2C2C2A';
  ctx.beginPath();
  ctx.arc(8, -5, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9, -6.5, 1.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#F0793A';
  ctx.beginPath();
  ctx.moveTo(14, -1);
  ctx.lineTo(22, 2);
  ctx.lineTo(14, 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 3;
  ctx.font = 'bold 36px sans-serif';
  ctx.strokeText(score, W/2, 60);
  ctx.fillText(score, W/2, 60);
}

function drawIdle() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px sans-serif';
  ctx.fillText('Flappy Bird', W/2, H/2 - 50);

  ctx.font = '18px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('클릭 또는 스페이스바로 시작', W/2, H/2);

  if (best > 0) {
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('최고 점수: ' + best, W/2, H/2 + 35);
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  const bx = W/2 - 120, by = H/2 - 80;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(ctx, bx, by, 240, 170, 12, true);

  ctx.fillStyle = '#E24B4A';
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('Game Over', W/2, by + 38);

  ctx.fillStyle = '#444';
  ctx.font = '18px sans-serif';
  ctx.fillText('점수: ' + score, W/2, by + 75);

  ctx.fillStyle = '#888';
  ctx.font = '15px sans-serif';
  ctx.fillText('최고 점수: ' + best, W/2, by + 103);

  ctx.fillStyle = '#5DB85D';
  roundRect(ctx, W/2 - 70, by + 120, 140, 36, 8, true);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('다시 시작', W/2, by + 144);
}

function checkCollision() {
  const bx = bird.x + 4, by = bird.y + 4;
  const bw = bird.w - 8, bh = bird.h - 4;

  if (by + bh >= H - 60 || by <= 0) return true;

  for (const p of pipes) {
    if (bx + bw > p.x + 4 && bx < p.x + PIPE_W - 4) {
      if (by < p.top || by + bh > p.top + GAP) return true;
    }
  }
  return false;
}

let lastTime = 0;
function loop(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  ctx.clearRect(0, 0, W, H);
  drawSky();

  drawCloud(60 + (frame * 0.3) % (W + 100) - 50, 80, 1);
  drawCloud(250 + (frame * 0.2) % (W + 100) - 50, 50, 0.7);
  drawCloud(150 + (frame * 0.15) % (W + 100) - 50, 110, 0.9);

  if (state === 'play') {
    groundX -= PIPE_SPEED;
    frame++;

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.min(Math.PI/2, Math.max(-0.4, bird.vy * 0.06));

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        if (score > best) best = score;
      }
    }

    if (pipes[pipes.length-1].x < W - 230) addPipe();
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);

    if (checkCollision()) { state = 'dead'; }
  } else if (state === 'idle') {
    bird.y = H/2 + Math.sin(frame * 0.05) * 8;
    frame++;
    groundX -= 1;
  }

  for (const p of pipes) drawPipe(p.x, p.top);

  drawGround();

  const flap = state === 'play' ? frame : frame;
  drawBird(bird.x, bird.y, bird.rot || 0, flap);

  if (state === 'play') drawScore();
  if (state === 'idle') drawIdle();
  if (state === 'dead') drawDead();

  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
